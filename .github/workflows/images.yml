name: images

# On every merge to main: build arm64 images (the demo server is a Graviton t4g), push them to
# ECR, then ask the demo server to deploy them. AWS access uses a stored IAM access key.
# Stays idle until these repo variables/secrets are set:
#   Variables: AWS_REGION, ECR_REGISTRY
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-main
  cancel-in-progress: false

jobs:
  build:
    if: vars.ECR_REGISTRY != ''
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - image: api
            context: .
            app: api
          - image: worker
            context: .
            app: worker
          - image: transcriber
            context: services/transcriber
            app: ''
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2.1.7
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          build-args: |
            APP=${{ matrix.app }}
            APP_VERSION=${{ steps.tag.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ vars.ECR_REGISTRY }}/sotto/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
            ${{ vars.ECR_REGISTRY }}/sotto/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy to the demo server through SSM
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          ID=$(aws ssm send-command \
            --document-name sotto-deploy \
            --targets "Key=tag:sotto-role,Values=demo" \
            --parameters "services=api worker transcriber,tag=$TAG" \
            --comment "sotto-api $TAG" \
            --query Command.CommandId --output text)
          echo "SSM command $ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-commands --command-id "$ID" --query 'Commands[0].Status' --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm list-command-invocations --command-id "$ID" --details \
                  --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text; exit 1 ;;
            esac
            sleep 10
          done
          exit 1
