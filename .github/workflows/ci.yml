name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keeps generated files honest. On pull requests from this repo it regenerates the lockfiles and
  # openapi.json and commits them to the PR branch if they changed (the agent that writes most
  # PRs can't reach npm/PyPI). On main, the `node` job fails instead if anything is stale.
  sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.2.0
      - run: pnpm install --no-frozen-lockfile
      # The coding agent's sandbox can't reach npm, so it downloads this exact install (every
      # workspace's node_modules) from a release asset to build and test locally. Keyed by the
      # manifests + lockfile (scripts/agent-deps.sh computes the same key). It runs before the
      # build so a compile error on the branch can't hold the snapshot back.
      - name: Publish node_modules snapshot (dev-cache release)
        env:
          GH_TOKEN: ${{ github.token }}
          LC_ALL: C
        run: |
          KEY=$(cat package.json pnpm-workspace.yaml pnpm-lock.yaml apps/*/package.json packages/*/package.json | sha256sum | cut -c1-16)
          NAME="node_modules-linux-x64-$KEY.tar.gz"
          if ! gh release view dev-cache > /dev/null 2>&1; then
            gh release create dev-cache --prerelease --title "dev-cache (CI tooling)" \
              --notes "node_modules snapshots for the coding agent's sandbox, which can't reach npm. Safe to delete."
          fi
          if gh release view dev-cache --json assets -q '.assets[].name' | grep -qx "$NAME"; then
            echo "Snapshot $NAME already published."
          else
            tar -czf "$RUNNER_TEMP/$NAME" node_modules apps/*/node_modules packages/*/node_modules
            ls -lh "$RUNNER_TEMP/$NAME"
            gh release upload dev-cache "$RUNNER_TEMP/$NAME" --clobber
          fi
          # Keep only the three newest snapshots.
          gh release view dev-cache --json assets -q '.assets | sort_by(.createdAt) | reverse | .[3:] | .[].name' |
            while read -r old; do gh release delete-asset dev-cache "$old" --yes; done
      - run: uv lock
        working-directory: services/transcriber
      # A broken build must not stop the lockfile from being committed: the `node` job reports
      # the failure, and the agent needs the lockfile to restore the snapshot above.
      - run: pnpm build
        continue-on-error: true
      - run: pnpm openapi
        continue-on-error: true
      - run: pnpm format
      - run: uv run --directory services/transcriber ruff format .
      - name: Commit regenerated files
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Generated files are up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate lockfiles, openapi.json and formatting"
          git push

  node:
    runs-on: ubuntu-24.04
    # Integration tests (apps/api/test/integration) run against a real Postgres with pgvector,
    # the same image production uses. Each test file creates and drops its own database.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: sotto
          POSTGRES_PASSWORD: sotto
          POSTGRES_DB: sotto
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sotto -d sotto" --health-interval 5s --health-timeout 3s
          --health-retries 20
      # Live status (GET /events) relays file events through Redis pub/sub.
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://sotto:sotto@localhost:5432/postgres
      # Uploads go to S3-compatible storage; SeaweedFS (started below) plays S3 here.
      TEST_S3_ENDPOINT: http://localhost:8333
      REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else echo "::warning::No pnpm-lock.yaml yet; the sync job will commit one."; pnpm install --no-frozen-lockfile; fi
      # A service container can't take a command, so SeaweedFS starts as a step. Without an
      # identities file its S3 gateway accepts any signature, which is all the tests need.
      - name: Start S3 (SeaweedFS)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.port=8333
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/)" != "000" ] && break
            sleep 1
          done
          curl -s -X PUT -o /dev/null -w "bucket: %{http_code}\n" http://localhost:8333/sotto-test
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: openapi.json is up to date
        if: hashFiles('openapi.json') != ''
        run: |
          pnpm openapi
          git diff --exit-code openapi.json || (echo "::error::openapi.json is stale. Run 'pnpm build && pnpm openapi' and commit it."; exit 1)

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/transcriber
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      # ffmpeg normalises audio (the tests encode every browser format); espeak-ng speaks a
      # sentence so the real Whisper test has words to find at a known time.
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      # The Whisper test model (tiny, ~75 MB) is downloaded once and cached between runs.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-v1
      - run: uv sync $( [ -f uv.lock ] && echo --locked )
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --junitxml=pytest.xml
        env:
          RUN_WHISPER_TESTS: '1'
      # Failures as annotations, so they read in the PR without opening the log.
      - name: Report test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("pytest.xml").iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  text = (bad.get("message") or "") + " | " + (bad.text or "")[-600:]
                  print(f"::error title={case.get('name')}::{text.replace(chr(10), ' ')}")
          PY

  # Builds the real images and boots them against real Postgres, Redis and RabbitMQ, then waits
  # for every /readyz to answer. This is the "one command starts everything" check.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build images
        run: |
          docker build --build-arg APP=api -t sotto-api:ci .
          docker build --build-arg APP=worker -t sotto-worker:ci .
          docker build -t sotto-transcriber:ci services/transcriber
      - name: Start dependencies
        run: docker compose -f compose.deps.yaml up -d --wait postgres redis rabbitmq
      - name: Migrate, start services, wait for readiness
        env:
          NET: sotto-deps_default
          DB: postgresql://sotto:sotto@postgres:5432/sotto
          MQ: amqp://sotto:sotto@rabbitmq:5672
        run: |
          docker run --rm --network $NET -e DATABASE_URL=$DB sotto-api:ci sh scripts/migrate.sh
          docker compose -f compose.deps.yaml exec -T postgres psql -U sotto -d sotto -c '\d leads'
          # Production mode refuses to start without its own auth secret; a throwaway one here.
          docker run -d --name api --network $NET -p 4000:4000 \
            -e DATABASE_URL=$DB -e REDIS_URL=redis://redis:6379 -e RABBITMQ_URL=$MQ \
            -e AUTH_SECRET="$(openssl rand -hex 32)" -e APP_URL=http://localhost:4000 sotto-api:ci
          # The worker reads files from S3 only when jobs arrive, so no storage is needed to be
          # ready; AI_EMBEDDINGS=fake because there's no Ollama here (a labelled mock).
          docker run -d --name worker --network $NET -p 4100:4100 -e RABBITMQ_URL=$MQ \
            -e DATABASE_URL=$DB -e REDIS_URL=redis://redis:6379 -e AI_EMBEDDINGS=fake:fake-hash sotto-worker:ci
          # Ready means "connected to the queue"; the labelled mock engine skips the model download.
          docker run -d --name transcriber --network $NET -p 5000:5000 -e RABBITMQ_URL=$MQ \
            -e TRANSCRIBER_ENGINE=fake sotto-transcriber:ci
          for i in $(seq 1 45); do
            if curl -fsS localhost:4000/readyz && curl -fsS localhost:4100/readyz && curl -fsS localhost:5000/readyz; then
              echo; curl -fsS localhost:4000/api/v1/status; echo
              # The images' own HEALTHCHECKs must agree (Compose --wait and the demo deploy rely on them).
              for c in api worker transcriber; do
                for j in $(seq 1 20); do
                  [ "$(docker inspect -f '{{.State.Health.Status}}' $c)" = healthy ] && break; sleep 3
                done
                docker inspect -f "$c {{.State.Health.Status}}" $c
                [ "$(docker inspect -f '{{.State.Health.Status}}' $c)" = healthy ] || { docker logs $c; exit 1; }
              done
              exit 0
            fi
            sleep 2
          done
          docker logs api; docker logs worker; docker logs transcriber; exit 1

  # Phase 4's "done when", for real: the built images on real Postgres (pgvector), Redis,
  # RabbitMQ and S3, with the transcriber running faster-whisper (tiny, for CI's speed). A PDF and
  # a 30-minute recording go in through the api like a browser sends them and must reach Ready
  # with the right pages and timestamps. scripts/ingestion-check.ts says what is checked.
  ingestion:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build images
        run: |
          docker build --build-arg APP=api -t sotto-api:ci .
          docker build --build-arg APP=worker -t sotto-worker:ci .
          docker build -t sotto-transcriber:ci services/transcriber
      # A 30-minute meeting that is mostly silence, with three sentences at known times: 0:03,
      # 20:30 (past the transcriber's first 20-minute window, so window offsets are tested) and
      # 29:30. Opus in Ogg, the way Firefox records.
      - name: Make the 30-minute recording
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          espeak-ng -s 130 -w /tmp/s1.wav "Good morning everyone. This is the design review for the Lagos launch."
          espeak-ng -s 130 -w /tmp/s2.wav "Next item. The budget for the second quarter is approved."
          espeak-ng -s 130 -w /tmp/s3.wav "Last point. We ship the recorder on Friday."
          ffmpeg -loglevel error -y -f lavfi -t 1800 -i anullsrc=r=16000:cl=mono \
            -i /tmp/s1.wav -i /tmp/s2.wav -i /tmp/s3.wav -filter_complex \
            "[1]aresample=16000,adelay=3000[a];[2]aresample=16000,adelay=1230000[b];[3]aresample=16000,adelay=1770000[c];[0][a][b][c]amix=inputs=4:duration=first:normalize=0" \
            -ac 1 -c:a libopus -b:a 32k /tmp/meeting.ogg
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/meeting.ogg
      # The tiny model (~75 MB) is downloaded once by the transcriber and cached between runs.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/whisper-models
          key: whisper-models-tiny-v1
      - name: Start dependencies
        run: |
          docker compose -f compose.deps.yaml up -d --wait postgres redis rabbitmq s3 mailpit
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/)" != "000" ] && break
            sleep 1
          done
          curl -s -X PUT -o /dev/null -w "bucket: %{http_code}\n" http://localhost:8333/sotto-files
      - name: Migrate and start the api, worker and transcriber
        env:
          NET: sotto-deps_default
          DB: postgresql://sotto:sotto@postgres:5432/sotto
          MQ: amqp://sotto:sotto@rabbitmq:5672
        run: |
          # Inside the network the services reach storage as s3:8333; the presigned URLs the
          # browser (this script, on the runner) uses point at localhost:8333.
          S3="-e S3_ENDPOINT=http://s3:8333 -e S3_BUCKET=sotto-files -e S3_FORCE_PATH_STYLE=true -e S3_ACCESS_KEY_ID=ci -e S3_SECRET_ACCESS_KEY=ci"
          docker run --rm --network $NET -e DATABASE_URL=$DB sotto-api:ci sh scripts/migrate.sh
          docker run -d --name api --network $NET -p 4000:4000 $S3 \
            -e S3_PUBLIC_ENDPOINT=http://localhost:8333 -e DATABASE_URL=$DB -e REDIS_URL=redis://redis:6379 \
            -e RABBITMQ_URL=$MQ -e AUTH_SECRET="$(openssl rand -hex 32)" -e APP_URL=http://localhost:4000 \
            -e SMTP_URL=smtp://mailpit:1025 -e AUTH_RATE_LIMIT=off sotto-api:ci
          # Embeddings are the labelled hash mock (no Ollama model download here); they still go
          # through pgvector. Transcription is the real engine.
          docker run -d --name worker --network $NET -p 4100:4100 $S3 -e RABBITMQ_URL=$MQ \
            -e DATABASE_URL=$DB -e REDIS_URL=redis://redis:6379 -e AI_EMBEDDINGS=fake:fake-hash sotto-worker:ci
          mkdir -p ~/whisper-models && chmod 777 ~/whisper-models
          docker run -d --name transcriber --network $NET -p 5000:5000 $S3 -e RABBITMQ_URL=$MQ \
            -e TRANSCRIBER_ENGINE=faster-whisper -e WHISPER_MODEL=tiny -v ~/whisper-models:/models \
            sotto-transcriber:ci
          for i in $(seq 1 90); do
            curl -fsS localhost:4000/readyz >/dev/null && curl -fsS localhost:4100/readyz >/dev/null \
              && curl -fsS localhost:5000/readyz >/dev/null && exit 0
            sleep 2
          done
          docker logs api; docker logs worker; docker logs transcriber; exit 1
      - name: Upload a PDF and a 30-minute recording, wait for Ready, check pages and times
        env:
          API_URL: http://localhost:4000
          MAILPIT_URL: http://localhost:8025
          MEETING_FILE: /tmp/meeting.ogg
        run: node scripts/ingestion-check.ts
      - name: Service logs
        if: always()
        run: |
          for c in api worker transcriber; do echo "::group::$c"; docker logs $c 2>&1 | tail -200; echo "::endgroup::"; done
      # The transcriber writes the model as its own user; the cache step saves it as the runner.
      - name: Make the model cache readable
        if: always()
        run: sudo chmod -R a+rX ~/whisper-models

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest dir /repo --redact --verbose
