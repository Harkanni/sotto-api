name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keeps generated files honest. On pull requests from this repo it regenerates the lockfiles and
  # openapi.json and commits them to the PR branch if they changed (the agent that writes most
  # PRs can't reach npm/PyPI). On main, the `node` job fails instead if anything is stale.
  sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.2.0
      - run: pnpm install --no-frozen-lockfile
      # The coding agent's sandbox can't reach npm, so it downloads this exact install (every
      # workspace's node_modules) from a release asset to build and test locally. Keyed by the
      # manifests + lockfile (scripts/agent-deps.sh computes the same key). It runs before the
      # build so a compile error on the branch can't hold the snapshot back.
      - name: Publish node_modules snapshot (dev-cache release)
        env:
          GH_TOKEN: ${{ github.token }}
          LC_ALL: C
        run: |
          KEY=$(cat package.json pnpm-workspace.yaml pnpm-lock.yaml apps/*/package.json packages/*/package.json | sha256sum | cut -c1-16)
          NAME="node_modules-linux-x64-$KEY.tar.gz"
          if ! gh release view dev-cache > /dev/null 2>&1; then
            gh release create dev-cache --prerelease --title "dev-cache (CI tooling)" \
              --notes "node_modules snapshots for the coding agent's sandbox, which can't reach npm. Safe to delete."
          fi
          if gh release view dev-cache --json assets -q '.assets[].name' | grep -qx "$NAME"; then
            echo "Snapshot $NAME already published."
          else
            tar -czf "$RUNNER_TEMP/$NAME" node_modules apps/*/node_modules packages/*/node_modules
            ls -lh "$RUNNER_TEMP/$NAME"
            gh release upload dev-cache "$RUNNER_TEMP/$NAME" --clobber
          fi
          # Keep only the three newest snapshots.
          gh release view dev-cache --json assets -q '.assets | sort_by(.createdAt) | reverse | .[3:] | .[].name' |
            while read -r old; do gh release delete-asset dev-cache "$old" --yes; done
      - run: uv lock
        working-directory: services/transcriber
      # A broken build must not stop the lockfile from being committed: the `node` job reports
      # the failure, and the agent needs the lockfile to restore the snapshot above.
      - run: pnpm build
        continue-on-error: true
      - run: pnpm openapi
        continue-on-error: true
      - run: pnpm format
      - run: uv run --directory services/transcriber ruff format .
      - name: Commit regenerated files
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Generated files are up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate lockfiles, openapi.json and formatting"
          git push

  node:
    runs-on: ubuntu-24.04
    # Integration tests (apps/api/test/integration) run against a real Postgres with pgvector,
    # the same image production uses. Each test file creates and drops its own database.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: sotto
          POSTGRES_PASSWORD: sotto
          POSTGRES_DB: sotto
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sotto -d sotto" --health-interval 5s --health-timeout 3s
          --health-retries 20
      # Live status (GET /events) relays file events through Redis pub/sub.
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://sotto:sotto@localhost:5432/postgres
      # Uploads go to S3-compatible storage; SeaweedFS (started below) plays S3 here.
      TEST_S3_ENDPOINT: http://localhost:8333
      REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else echo "::warning::No pnpm-lock.yaml yet; the sync job will commit one."; pnpm install --no-frozen-lockfile; fi
      # A service container can't take a command, so SeaweedFS starts as a step. Without an
      # identities file its S3 gateway accepts any signature, which is all the tests need.
      - name: Start S3 (SeaweedFS)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.port=8333
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/)" != "000" ] && break
            sleep 1
          done
          curl -s -X PUT -o /dev/null -w "bucket: %{http_code}\n" http://localhost:8333/sotto-test
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: openapi.json is up to date
        if: hashFiles('openapi.json') != ''
        run: |
          pnpm openapi
          git diff --exit-code openapi.json || (echo "::error::openapi.json is stale. Run 'pnpm build && pnpm openapi' and commit it."; exit 1)

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/transcriber
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync $( [ -f uv.lock ] && echo --locked )
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # Builds the real images and boots them against real Postgres, Redis and RabbitMQ, then waits
  # for every /readyz to answer. This is the "one command starts everything" check.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build images
        run: |
          docker build --build-arg APP=api -t sotto-api:ci .
          docker build --build-arg APP=worker -t sotto-worker:ci .
          docker build -t sotto-transcriber:ci services/transcriber
      - name: Start dependencies
        run: docker compose -f compose.deps.yaml up -d --wait postgres redis rabbitmq
      - name: Migrate, start services, wait for readiness
        env:
          NET: sotto-deps_default
          DB: postgresql://sotto:sotto@postgres:5432/sotto
          MQ: amqp://sotto:sotto@rabbitmq:5672
        run: |
          docker run --rm --network $NET -e DATABASE_URL=$DB sotto-api:ci sh scripts/migrate.sh
          docker compose -f compose.deps.yaml exec -T postgres psql -U sotto -d sotto -c '\d leads'
          # Production mode refuses to start without its own auth secret; a throwaway one here.
          docker run -d --name api --network $NET -p 4000:4000 \
            -e DATABASE_URL=$DB -e REDIS_URL=redis://redis:6379 -e RABBITMQ_URL=$MQ \
            -e AUTH_SECRET="$(openssl rand -hex 32)" -e APP_URL=http://localhost:4000 sotto-api:ci
          docker run -d --name worker --network $NET -p 4100:4100 -e RABBITMQ_URL=$MQ sotto-worker:ci
          docker run -d --name transcriber -p 5000:5000 sotto-transcriber:ci
          for i in $(seq 1 45); do
            if curl -fsS localhost:4000/readyz && curl -fsS localhost:4100/readyz && curl -fsS localhost:5000/readyz; then
              echo; curl -fsS localhost:4000/api/v1/status; echo
              # The images' own HEALTHCHECKs must agree (Compose --wait and the demo deploy rely on them).
              for c in api worker transcriber; do
                for j in $(seq 1 20); do
                  [ "$(docker inspect -f '{{.State.Health.Status}}' $c)" = healthy ] && break; sleep 3
                done
                docker inspect -f "$c {{.State.Health.Status}}" $c
                [ "$(docker inspect -f '{{.State.Health.Status}}' $c)" = healthy ] || { docker logs $c; exit 1; }
              done
              exit 0
            fi
            sleep 2
          done
          docker logs api; docker logs worker; docker logs transcriber; exit 1

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest dir /repo --redact --verbose
