[project]
name = "sotto-transcriber"
version = "0.0.0"
description = "Sotto transcription service: audio in, timed segments out. Engine chosen by config."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic-settings>=2.15,<3",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.1,<10",
  "ruff>=0.16,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
